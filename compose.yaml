# Canonical stack (TECHNICAL_SPECIFICATION §14.1), rootless Podman-first.
#
#   podman-compose up                              -> postgres + web (headless web on 127.0.0.1:8080)
#   podman-compose --profile dev up                -> + Caddy, TLS at https://localhost:8443
#   podman-compose --profile production up -d       -> + cloudflared named tunnel (no Caddy)
#
# `web` and `postgres` have no profile, so they always start. `caddy` and `cloudflared` are behind
# profiles. The web port is published on loopback only — the app trusts X-Forwarded-* headers and is
# meant to be reached through the proxy, never directly from the LAN/WAN.
#
# EVERY IMAGE REFERENCE HERE IS FULLY QUALIFIED (F-51), and that is a correctness requirement rather
# than a style preference. A short name like `postgres:17-alpine` is resolved through
# `unqualified-search-registries`, which Fedora's containers-common populates and a stock Debian
# leaves commented out — so on Debian, rootless Podman answers the canonical stack with
# `short-name "postgres:17-alpine" did not resolve to an alias`, `postgres` never starts, and `web`
# then fails its own `depends_on` with a message about a missing container. scripts/restore_drill.sh
# has defaulted DRILL_POSTGRES_IMAGE to a fully qualified name since Slice 16 for exactly this
# reason; the rule was applied to the drill and not to the stack the drill rehearses.
#
# NO `depends_on` HERE MAY BE GATED ON A HEALTH CONDITION (F-53), and that is the same kind of rule
# as the one above: a correctness requirement on the canonical engine, not a preference. The only
# condition this file may use is `service_started`. podman-compose 1.3.0 — what Debian trixie ships —
# implements `up -d` as `podman run -d` for every container FOLLOWED BY a wait on each dependency's
# condition, in an unbounded `while True:` retry loop that logs at debug level and nothing else. So a
# condition that is never satisfied does not fail: `up -d` starts the whole stack, prints the
# container ids, and then never returns, with no output to say why. On a host where the container
# health status never flips — no systemd user session to run podman's healthcheck timer, or a podman
# too old for `wait --condition=healthy` — that is a permanent hang on the documented command.
#
# Nothing is lost by dropping the condition, because the application never needed it:
# SchemaMigrationRunner retries a connection failure thirty times at two-second intervals before
# giving up (ADR-0012, and its own comment says "at compose start the web container can race
# PostgreSQL"). `web` starting first is a race the code was written to lose safely.

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myrestaurant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myrestaurant}
      POSTGRES_DB: ${POSTGRES_DB:-myrestaurant}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only: lets a host-run `dotnet watch` (see run.sh) reach the database in dev.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Kept, and deliberately not depended on. It is what `podman ps`, `scripts/dev_instance.sh
      # status` and an operator at a terminal read to answer "is the database actually up"; what it
      # must not be is the thing standing between `up -d` and returning (F-53, and the header above).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myrestaurant} -d ${POSTGRES_DB:-myrestaurant}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Containerfile
      args:
        # What this build is (§11.9). Passed through with an EMPTY default, on F-50's ruling: the
        # fallback belongs to Containerfile's own ARG, which reports an unstamped build as "not
        # recorded" rather than guessing. Repeating a value here would override the one place the
        # default is written down — the same mistake one layer up. scripts/dev_instance.sh sets this
        # from `git rev-parse HEAD` so /source names the commit a tester actually reached.
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    restart: unless-stopped
    depends_on:
      postgres:
        # service_started, and NEVER service_healthy — see the header (F-53). This orders the two
        # containers and nothing more; waiting for the database to accept connections is the
        # application's job, and SchemaMigrationRunner does it with a bounded retry that predates
        # this line. A health condition here hangs `podman-compose up -d` forever on any host whose
        # health status does not flip, with no output naming the cause.
        condition: service_started
    environment:
      RESTAURANT_NAME: ${RESTAURANT_NAME:-My Restaurant}
      RESTAURANT_PUBLIC_ORIGIN: ${RESTAURANT_PUBLIC_ORIGIN:-https://localhost:8443}
      # Wildcard origins allowed to act as the WebAuthn relying party besides the origin above and
      # loopback (ADR-0005, §3.3). Default trusts Cloudflare quick tunnels so scripts/quick_tunnel.sh
      # works with passkeys; scripts/quick_tunnel.sh also exports RESTAURANT_PUBLIC_ORIGIN per run.
      RESTAURANT_TRUSTED_ORIGIN_PATTERNS: ${RESTAURANT_TRUSTED_ORIGIN_PATTERNS:-https://*.trycloudflare.com}
      RESTAURANT_TIME_ZONE: ${RESTAURANT_TIME_ZONE:-America/New_York}
      RESTAURANT_CLOCK_FORMAT: ${RESTAURANT_CLOCK_FORMAT:-12-hour}
      RESTAURANT_CURRENCY_CODE: ${RESTAURANT_CURRENCY_CODE:-USD}
      # The AGPL §13 offer's one variable (§11.9, §13, OPERATIONS §15). Passed through with an
      # EMPTY default rather than the upstream URL, and that asymmetry with the lines above is
      # deliberate: RestaurantOptions.DefaultSourceUrl is the one place the fallback is written
      # down, and a fork's first edit to this program is very often that constant. Repeating it
      # here would override the fork's own default with this repository's — which is F-50's
      # failure reintroduced one layer up. An empty value is read as unset (F-50).
      RESTAURANT_SOURCE_URL: ${RESTAURANT_SOURCE_URL:-}
      RESTAURANT_DATABASE_CONNECTION_STRING: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-myrestaurant};Username=${POSTGRES_USER:-myrestaurant};Password=${POSTGRES_PASSWORD:-myrestaurant}
      DATA_PROTECTION_KEYS_DIRECTORY: /var/lib/myrestaurant/dataprotection
      KITCHEN_SUBMISSION_REMINDER_SECONDS: ${KITCHEN_SUBMISSION_REMINDER_SECONDS:-60}
      TABLE_JOIN_TOKEN_ROTATION_SECONDS: ${TABLE_JOIN_TOKEN_ROTATION_SECONDS:-60}
      TABLE_JOIN_GRANT_MINUTES: ${TABLE_JOIN_GRANT_MINUTES:-10}
      TABLE_DISPLAY_PAIRING_CODE_MINUTES: ${TABLE_DISPLAY_PAIRING_CODE_MINUTES:-10}
      ARGON2_MEMORY_KIBIBYTES: ${ARGON2_MEMORY_KIBIBYTES:-65536}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      ARGON2_MAX_CONCURRENT_HASHES: ${ARGON2_MAX_CONCURRENT_HASHES:-4}
      # OpenTelemetry is optional; when unset the app attaches no OTLP exporter (§12).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-myrestaurant}
    volumes:
      # ':U' asks Podman to chown the volume to the container user (rootless). Docker ignores it;
      # if you are on Docker and it complains, drop the ':U' suffix (BUILD_PROGRESS: known caveats).
      - dataprotection-keys:/var/lib/myrestaurant/dataprotection:U
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  caddy:
    image: docker.io/library/caddy:2-alpine
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    profiles: ["production"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Empty default (deliberately NOT `${...:?}`): podman-compose — the canonical engine
      # (ADR-0004) — interpolates EVERY service in this file at parse time regardless of the active
      # profile, so a `:?` guard here aborts even `podman-compose up postgres` (what run.sh does in
      # dev). cloudflared still fails fast on an empty token — just at container start rather than at
      # compose-parse. PRODUCTION: set CLOUDFLARE_TUNNEL_TOKEN in .env before `--profile production`.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  postgres-data:
  dataprotection-keys:
  caddy-data:
  caddy-config:
