# Publish the container image on a tag (TECHNICAL_SPECIFICATION §16.4: "publish image on tag").
#
# The gates are not re-declared here. `verify` calls .github/workflows/ci.yml, so a release runs the
# same shell lint, the same strict build, the same test suite and the same boot smoke that every
# push runs — a second copy of them would be a second copy to keep correct.
#
# Tagging:
#     git tag --annotate v0.6.0 --message 'M6 slice 1'
#     git push origin v0.6.0
#
# Result: ghcr.io/<owner>/<repository>:0.6.0, :0.6, and :sha-<commit>. See docs/OPERATIONS.md §14
# for how to deploy from the registry instead of building on the box.
#
# The tag is also what the image says about itself: `verify` proves the tree, then the version is
# derived from the tag and the commit and passed into the build, so a running instance answers
# /source with the same numbers the registry used (TECHNICAL_SPECIFICATION §11.9). Finally a GitHub
# release is opened on the tag, because a published image with no release note is a thing people have
# to reverse-engineer from a manifest.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release in flight: a half-pushed manifest is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # Named rather than `secrets: inherit`. The governance job's advisory half reads the GitHub
    # API and reports the published settings, and a release is the run where that report is worth
    # the most — it is the run that creates the package whose visibility nothing in this tree can
    # see (F-46). One secret, passed on purpose, is a smaller statement than all of them.
    secrets:
      ADMIN_READ_TOKEN: ${{ secrets.ADMIN_READ_TOKEN }}

  image:
    name: publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: check out the tag
        uses: actions/checkout@v7

      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      - name: sign in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derived in a step rather than taken from metadata-action's outputs, because the image needs
      # the bare version string as a build argument and reading it back out of a tag list is one more
      # thing that can silently produce the wrong answer. Both values arrive through `env:` rather
      # than being interpolated into the script body: a ref name is attacker-influencable on a fork,
      # and `${{ }}` inside `run:` is textual substitution before the shell ever sees it.
      - name: derive the version from the tag
        id: version
        env:
          REFERENCE_NAME: ${{ github.ref_name }}
          REFERENCE_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REFERENCE_TYPE" = 'tag' ]; then
              version="${REFERENCE_NAME#v}"
          else
              # workflow_dispatch off a branch. Publishing 1.0.0 from an untagged branch would be a
              # lie the registry then caches, so say what it actually is.
              version="0.0.0-${REFERENCE_NAME//[^0-9A-Za-z.-]/-}"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'the image will report version %s at revision %s\n' "$version" "${{ github.sha }}"

      - name: derive tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=MyRestaurant
            org.opencontainers.image.description=Self-hosted, single-restaurant ordering system
            org.opencontainers.image.licenses=AGPL-3.0-only

      # linux/amd64 only, deliberately. The Containerfile runs a full `dotnet publish` inside the
      # build stage, and doing that for arm64 under QEMU emulation takes long enough to time out.
      # An arm64 image wants a cross-compiled publish (-r linux-arm64 from an amd64 SDK) rather than
      # an emulated one; that is a Containerfile change, not a workflow line, so it is not here.
      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # What the running instance will say about itself (§11.9). Without these the published
          # image reports Directory.Build.props' VersionPrefix and no revision at all — which is to
          # say, every release would claim to be the same build.
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            SOURCE_REVISION=${{ github.sha }}

      - name: summarize
        run: |
          set -euo pipefail
          {
              echo "### Published"
              echo
              echo '```'
              printf '%s\n' "${{ steps.metadata.outputs.tags }}"
              echo '```'
              echo
              echo "Version: \`${{ steps.version.outputs.value }}\` at \`${{ github.sha }}\`."
              echo "A running instance reports the same at \`/source\`."
              echo
              echo "Pull with: \`podman pull ghcr.io/${{ github.repository }}:\${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------------------------------
  # The release note. Separate from `image` and downstream of it, so a failed push cannot leave a
  # release advertising an image that is not in the registry.
  # -------------------------------------------------------------------------------------------------
  release-notes:
    name: publish release notes
    needs: image
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only job in either workflow that writes anything to the repository. Scoped here rather
      # than raised at the workflow level for that reason.
      contents: write

    steps:
      - name: check out the tag
        uses: actions/checkout@v7

      # Idempotent on purpose: re-running a release (or dispatching one twice) should update the note
      # rather than fail on "already exists". --verify-tag refuses to invent a tag that is not there,
      # which is the one mistake worth being loud about.
      - name: open or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
              echo "### Container image"
              echo
              echo '```bash'
              echo "podman pull ghcr.io/${{ github.repository }}:${VERSION}"
              echo '```'
              echo
              echo "Built from \`${{ github.sha }}\`, \`linux/amd64\`."
              echo
              echo "### Verifying what you are running"
              echo
              echo "Every page links to \`/source\` in its footer. That page reports this version and"
              echo "revision, and offers the corresponding source under AGPL-3.0-only."
              echo
              echo "### Reading further"
              echo
              echo "- Deploying from the registry: \`docs/OPERATIONS.md\` §14"
              echo "- What changed and why: \`docs/BUILD_PROGRESS.md\`"
              echo "- Configuration: \`.env.example\` and \`docs/TECHNICAL_SPECIFICATION.md\` §13"
          } > "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --notes-file "$notes"
              echo "updated the existing release for $TAG"
          else
              gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag
              echo "created the release for $TAG"
          fi
