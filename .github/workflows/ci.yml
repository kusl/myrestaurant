# Continuous integration (TECHNICAL_SPECIFICATION §16.4).
#
# Six gates. None of them can be satisfied by a tree that merely looks right:
#
#   tree            The tree is machine-readable at all: no context-dump separators, no
#                   whitespace-only lines, LF endings with a final newline, and every MSBuild and
#                   YAML file parses. Cheapest gate in the workflow and the one that catches the
#                   damage that disguises itself as a toolchain fault — see scripts/check_tree.sh
#                   for the incident that put it here.
#
#   governance      A security policy exists, README/CONTRIBUTING/SECURITY each point at the
#                   others, and no tracked file asserts a GitHub repository setting. That half is
#                   blocking and needs only git and grep. A second, advisory half reads the API and
#                   reports what the published repository actually says — advisory because a fork's
#                   settings are the fork's business. See scripts/check_repository.sh for the
#                   finding that put it here: every gate was green while the repository offered a
#                   reader nowhere to report a defect, and the one document that addressed the
#                   question was wrong about it.
#
#   shell-scripts   Every tracked *.sh parses (`bash -n`) and passes shellcheck. This is the
#                   project's own pre-delivery discipline, enforced instead of remembered.
#
#   build-and-test  Restore, a Release build with warnings escalated to errors, then the whole
#                   xUnit suite. The data-access tests start real PostgreSQL 17 containers through
#                   Testcontainers; a GitHub runner has a Docker socket, so those tests RUN here
#                   rather than skipping the way they do on a machine with no container engine.
#
#   boot-smoke      The production Containerfile is built and the resulting image is booted against
#                   a real PostgreSQL, and /healthz/ready must answer 200. This is the only gate
#                   that proves DbUp migrations apply and the composition root resolves — a class of
#                   failure no unit test sees, because it happens exactly once, at startup, and
#                   presents as a 500 on some route hours later.
#
#                   It then backs that instance up with scripts/backup.sh and puts the result through
#                   scripts/restore_drill.sh (§15), so recovery is rehearsed on every push instead of
#                   being a runbook nobody has executed. It lives here rather than in a job of its
#                   own because everything the drill needs — a built image, a migrated database, a
#                   live Data Protection key ring — is already standing up in this job.
#
#   end-to-end      The §16.3 Playwright scenarios, in Chromium, against the built application. Its
#                   own job rather than part of build-and-test, for two reasons: the scenarios are
#                   opt-in (MYRESTAURANT_E2E) so a workstation `dotnet test` never downloads a
#                   browser by surprise, and a browser-driven flake should be attributable at a
#                   glance instead of hiding inside a nine-hundred-fact summary.
#
# The workflow is also callable (`workflow_call`) so the release pipeline runs precisely these
# gates before it publishes an image, rather than a copy of them that can drift.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    # Declared, and optional. A called workflow sees only the secrets it is handed, so without
    # this the governance job's advisory half would silently skip on the one run that publishes
    # an image — the run whose settings report is worth the most (F-46). Optional because a fork
    # will not have the secret and the half it feeds is advisory anyway.
    secrets:
      ADMIN_READ_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same ref makes the first answer irrelevant, so cancel it. Keyed on the ref
# rather than the workflow so a tag build and a branch build never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_XMLDOC_MODE: skip

jobs:
  # -----------------------------------------------------------------------------------------------
  # 1. Tree hygiene. Seconds, no SDK, no containers, no network beyond the checkout.
  #
  # A job of its own rather than a step bolted onto shell-scripts, for two reasons. It is not about
  # shell: the file it exists to protect is XML, and the incident that produced it took out the
  # build for every project in the solution. And a distinct check name means a failure here is
  # attributable from the commit list without opening anything — which is the whole point of a gate
  # whose failure mode is a message that blames the wrong tool.
  # -----------------------------------------------------------------------------------------------
  tree:
    name: tree hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out
        uses: actions/checkout@v7

      # Blocking, all five of its gates. PyYAML is preinstalled on GitHub's Ubuntu runners, so the
      # YAML parse — the one gate that degrades to a skip on a workstation without it — runs here.
      - name: the tree parses
        run: bash scripts/check_tree.sh

  # -----------------------------------------------------------------------------------------------
  # 2. Repository governance. The layer every other gate in this file is blind to.
  #
  # Its own job for the same reason `tree` has one: a distinct check name makes a failure
  # attributable from the commit list. But the deeper reason it is separate is that half of it is
  # advisory, and a job that mixes a blocking assertion with an advisory report teaches nobody
  # which one just spoke.
  #
  # administration:read is requested for exactly one call — the private-vulnerability-reporting
  # endpoint — and is scoped to this job rather than the workflow. On a fork's pull request the
  # token will not carry it; the script reports that as unknown rather than as a finding, which is
  # why this job stays green there.
  # -----------------------------------------------------------------------------------------------
  governance:
    name: repository governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: check out
        uses: actions/checkout@v7

      # The tree half blocks. The platform half warns and never moves the exit code, so a
      # repository setting nobody has clicked yet cannot hold up a build — it just says so, on
      # every run, until somebody clicks it.
      - name: the governance surface, and the published settings
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_READ_TOKEN }}
        run: bash scripts/check_repository.sh

  # -----------------------------------------------------------------------------------------------
  # 3. Shell scripts. Also cheap, so it runs alongside everything else and fails in ~30 seconds.
  # -----------------------------------------------------------------------------------------------
  shell-scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out
        uses: actions/checkout@v7

      - name: parse every tracked script
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'checking %d script(s)\n' "${#scripts[@]}"
          for script in "${scripts[@]}"; do
              printf '  bash -n %s\n' "$script"
              bash -n "$script"
          done

      - name: install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          shellcheck --version

      # Blocking at `warning`. Every script in the tree is clean at `style` today, but the gate sits
      # one notch lower on purpose: a shellcheck upgrade that adds a new style check would otherwise
      # turn a build red on a day nobody touched the repository, and that is how people learn to
      # ignore a red build. The stricter pass runs below, advisory only.
      - name: shellcheck (blocking, severity=warning)
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --severity=warning --color=always "${scripts[@]}"

      - name: shellcheck (advisory, severity=style)
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --severity=style --color=always "${scripts[@]}"

  # -----------------------------------------------------------------------------------------------
  # 4. Build and the full test suite, with warnings as errors.
  # -----------------------------------------------------------------------------------------------
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: check out
        uses: actions/checkout@v7

      # 10.0.x rather than global.json's exact pin: global.json says 10.0.100 with
      # rollForward=latestMinor, so any 10.0 SDK satisfies it, and asking for an exact patch that
      # has since been delisted is a needless way to fail.
      - name: set up the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # There are no packages.lock.json files, so setup-dotnet's own cache input cannot be used;
      # key the global-packages folder on the only files that can change a restore graph.
      - name: cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: dotnet --info
        run: dotnet --info

      - name: restore
        run: dotnet restore MyRestaurant.slnx

      # ContinuousIntegrationBuild=true flips TreatWarningsAsErrors in Directory.Build.props (and
      # makes the build deterministic). A plain `dotnet build` on a developer's clone stays lenient.
      - name: build (Release, warnings as errors)
        run: |
          dotnet build MyRestaurant.slnx \
              --configuration Release \
              --no-restore \
              -p:ContinuousIntegrationBuild=true

      # Testcontainers finds /var/run/docker.sock on the runner, so the ~190 data-access integration
      # facts execute here. MYRESTAURANT_E2E is deliberately NOT set: the §16.3 scenarios have their
      # own job below, and running them twice would double the browser time for one answer.
      - name: test
        run: |
          dotnet test MyRestaurant.slnx \
              --configuration Release \
              --no-build \
              -p:ContinuousIntegrationBuild=true \
              --logger "trx" \
              --logger "console;verbosity=normal" \
              --results-directory "${{ github.workspace }}/TestResults"

      - name: upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      # Advisory. A published advisory against a package we already depend on is real news, but it
      # arrives without a commit, so it reports rather than blocks (see Directory.Build.props).
      - name: vulnerable package audit (advisory)
        continue-on-error: true
        run: dotnet list MyRestaurant.slnx package --vulnerable --include-transitive

  # -----------------------------------------------------------------------------------------------
  # 5. Boot the actual production image against an actual PostgreSQL, then rehearse recovery from it.
  # -----------------------------------------------------------------------------------------------
  boot-smoke:
    name: boot smoke (container image)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # compose.yaml is deliberately not used here: its data-protection volume carries Podman's ':U'
    # suffix (ADR-0004 — rootless Podman is canonical), which Docker Compose rejects outright. A
    # service container plus one `docker run` is the same topology with none of that argument.
    # Fully qualified, like every other image reference in this repository (§14.1, F-60). Docker
    # normalises `postgres:17-alpine` to exactly this reference, so on this runner the two forms name
    # the same image and the same layer cache — which means writing it out costs nothing here and
    # makes one rule true of the whole tree instead of true of compose.yaml and the restore drill.
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: myrestaurant
          POSTGRES_PASSWORD: myrestaurant
          POSTGRES_DB: myrestaurant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myrestaurant -d myrestaurant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: check out
        uses: actions/checkout@v7

      # SOURCE_REVISION is what turns "some build of main" into an identifiable one: it becomes the
      # assembly's informational version, which becomes /source's answer and OpenTelemetry's
      # service.version (§11.9, §12). Passing it here is also what lets the step below assert the
      # whole chain actually works.
      - name: build the runtime image
        run: |
          docker build --file Containerfile --tag myrestaurant_web:ci \
              --build-arg SOURCE_REVISION="${{ github.sha }}" \
              .

      # --network host so the container reaches the service database on the runner's published
      # 127.0.0.1:5432 and publishes its own 8080 back to the runner for the probe below.
      - name: start it against the service database
        run: |
          docker run --detach --name myrestaurant_web_ci --network host \
              --env RESTAURANT_NAME="CI Restaurant" \
              --env RESTAURANT_PUBLIC_ORIGIN="https://localhost:8443" \
              --env RESTAURANT_TIME_ZONE="America/New_York" \
              --env RESTAURANT_CLOCK_FORMAT="12-hour" \
              --env RESTAURANT_CURRENCY_CODE="USD" \
              --env RESTAURANT_DATABASE_CONNECTION_STRING="Host=127.0.0.1;Port=5432;Database=myrestaurant;Username=myrestaurant;Password=myrestaurant" \
              --env DATA_PROTECTION_KEYS_DIRECTORY="/var/lib/myrestaurant/dataprotection" \
              myrestaurant_web:ci

      - name: wait for /healthz/ready
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 180 ))
          while (( SECONDS < deadline )); do
              if ! docker inspect --format '{{.State.Running}}' myrestaurant_web_ci | grep --quiet true; then
                  echo "the web container exited before it became ready" >&2
                  exit 1
              fi
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/healthz/ready; then
                  echo
                  echo "ready: config bound, migrations applied, database reachable."
                  curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/healthz/live
                  echo
                  exit 0
              fi
              sleep 3
          done
          echo "/healthz/ready did not answer 200 within 180s" >&2
          exit 1

      # Data Protection creates its first key the first time it protects anything, and
      # /healthz/ready protects nothing — so on a freshly booted instance the key ring is an empty
      # directory. /setup renders a form, which mints an antiforgery token, which mints the key.
      # Without this step the drill's key-ring gate would report an empty ring on every run and
      # would therefore stop meaning anything.
      - name: render a page so a Data Protection key exists
        run: |
          curl --fail --silent --show-error --max-time 10 --output /dev/null \
              http://127.0.0.1:8080/setup
          echo "/setup rendered; the key ring is no longer empty."

      # The source offer must name the revision it is offering the source OF (§11.9, AGPL §13), and
      # that answer travels a long way to get onto the page: a build argument, an MSBuild property, an
      # assembly attribute, a parse, a component. Every link in that chain is silent when it breaks —
      # the page still renders, and it renders "not recorded", which looks like a configuration choice
      # rather than a defect. So the gate is the commit itself appearing in the response, which is
      # exactly the assertion nothing weaker can be satisfied by.
      #
      # It doubles as an anonymous-reachability check: no cookie is sent, so a regression that put the
      # licence offer behind authentication would fail here.
      - name: the source offer names this commit
        run: |
          set -euo pipefail
          page=$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/source)
          if ! grep --quiet --fixed-strings "${{ github.sha }}" <<<"$page"; then
              echo "/source did not report this build's revision (${{ github.sha }})." >&2
              echo "--- what it said instead ---" >&2
              printf '%s\n' "$page" >&2
              exit 1
          fi
          echo "/source reports ${{ github.sha }} and answered anonymously."

      # POSTGRES_CONTAINER and WEB_CONTAINER are set rather than discovered: the service container's
      # name is generated by the runner, and scripts/backup.sh refuses to guess when more than one
      # container matches its filter — which is exactly the situation the drill's own scratch
      # container creates a few seconds later.
      #
      # CONTAINER_ENGINE=docker is the load-bearing line here (F-43). This runner image installs a
      # static podman bundle alongside Docker, so `command -v podman` succeeds on it — and every
      # container in this job, the service database included, belongs to the Docker daemon. Without
      # this, scripts/backup.sh reached for podman, `podman exec <a docker container id>` failed with
      # "no such container", and the script reported it as the database not answering pg_isready:
      # a message that sends a reader to PostgreSQL for a fault that is entirely in engine selection.
      # The script now also infers the engine from the container it was given, so this is belt and
      # braces — but it is the half that is obvious from the job, which is where it belongs.
      #
      # The backup set is deliberately NOT uploaded as an artifact. The -dataprotection.tar is key
      # material in the clear; it is throwaway here, but publishing one is not a habit worth forming.
      - name: back up the booted instance
        env:
          BACKUP_DIRECTORY: ${{ github.workspace }}/ci-backups
          CONTAINER_ENGINE: docker
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          WEB_CONTAINER: myrestaurant_web_ci
        run: bash scripts/backup.sh

      # Not --strict on this first landing. Every FAIL gate still blocks; what --strict adds is that
      # ignored pg_restore errors and an empty key ring also fail, and neither number has been
      # observed on a real run yet. Once a few runs report "pg_restore completed with no errors",
      # tightening this is a one-word edit.
      #
      # CONTAINER_ENGINE=docker for a second reason as well as the first. The drill creates its own
      # scratch container, so either engine would work — but this exact image is already in the Docker
      # daemon's store, because the service container above pulled it. Left to its default the drill
      # would pull the same image again into podman's store, and pay for it on every push.
      #
      # The reference is spelled the same way as the service container's, which is what keeps that
      # sentence true: Docker normalises a short name to `docker.io/library/…`, so the qualified form
      # is a hit in the store rather than a second pull. Writing both out fully is §14.1's rule
      # applied to every image reference in the tree rather than to two of them (F-60).
      - name: drill the restore
        env:
          BACKUP_DIRECTORY: ${{ github.workspace }}/ci-backups
          CONTAINER_ENGINE: docker
          DRILL_POSTGRES_IMAGE: docker.io/library/postgres:17-alpine
        run: bash scripts/restore_drill.sh

      - name: container logs
        if: ${{ failure() }}
        run: docker logs myrestaurant_web_ci

      - name: stop the container
        if: ${{ always() }}
        run: docker rm --force myrestaurant_web_ci || true

  # -----------------------------------------------------------------------------------------------
  # 6. The §16.3 end-to-end scenarios, in a real browser.
  # -----------------------------------------------------------------------------------------------
  end-to-end:
    name: end to end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: check out
        uses: actions/checkout@v7

      - name: set up the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: restore
        run: dotnet restore MyRestaurant.slnx

      # The harness boots the web application from its own build output, so this build is not merely
      # a prerequisite for the test assembly — it produces the binary under test.
      - name: build (Release, warnings as errors)
        run: |
          dotnet build MyRestaurant.slnx \
              --configuration Release \
              --no-restore \
              -p:ContinuousIntegrationBuild=true

      # The harness calls `playwright install chromium` itself, which downloads the browser but not
      # its system libraries. --with-deps needs apt and therefore root, which a test process has no
      # business asking for — so it happens here, once, through the wrapper the build produced.
      # pwsh is preinstalled on GitHub's Ubuntu runners.
      - name: cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: install Chromium and its dependencies
        run: |
          set -euo pipefail
          pwsh tests/MyRestaurant.EndToEnd.Tests/bin/Release/net10.0/playwright.ps1 \
              install --with-deps chromium

      # MYRESTAURANT_E2E is what turns the fifteen placeholders into real scenarios. Testcontainers
      # reaches the runner's Docker socket for the shared PostgreSQL 17 container; each scenario then
      # creates its own database on it and boots the application on its own loopback port.
      - name: run the §16.3 scenarios
        env:
          MYRESTAURANT_E2E: "1"
        run: |
          dotnet test tests/MyRestaurant.EndToEnd.Tests/MyRestaurant.EndToEnd.Tests.csproj \
              --configuration Release \
              --no-build \
              -p:ContinuousIntegrationBuild=true \
              --logger "trx" \
              --logger "console;verbosity=normal" \
              --results-directory "${{ github.workspace }}/TestResults"

      - name: upload end-to-end results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

